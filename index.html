<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon classeur</title>
<meta name="description" content="Toutes tes échéances administratives et où sont rangés tes papiers.">
<meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f121c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Classeur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Design tokens — system fonts on purpose: the app must work fully offline */
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface-2:#eceef6; --ink:#161b31; --muted:#646b86; --line:#e0e3ee;
  --accent:#3a4fd6; --accent-ink:#ffffff; --accent-soft:#e6e9fb;
  --late:#d0342c; --late-soft:#fdebe9; --soon:#b86a00; --soon-soft:#fdf1de; --ok:#1f8a5b; --ok-soft:#e1f4ea;
  --scrim:rgba(12,16,32,.42);
  --d-identite:#6b4fd8; --d-impots:#d0342c; --d-logement:#2f7d6d; --d-voiture:#2c6fb8; --d-sante:#d0457a;
  --d-banque:#3a4a8c; --d-energie:#c98400; --d-famille:#2a9696; --d-travail:#7a5b33; --d-assurances:#4f8a33; --d-abonnements:#8a5ca8; --d-chomage:#c2571a; --d-loisirs:#0d87a8;
  --f-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-round:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --r:14px; --tabbar:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f121c; --surface:#1a1e2c; --surface-2:#242a3b; --ink:#eceff9; --muted:#9aa1bd; --line:#2b3145;
  --accent:#8b9cff; --accent-ink:#0e1224; --accent-soft:#252c4f;
  --late:#ff8278; --late-soft:#3b201e; --soon:#f2b552; --soon-soft:#3a2d16; --ok:#6fd4a2; --ok-soft:#163326;
  --scrim:rgba(0,0,0,.6);
  --d-identite:#a593ff; --d-impots:#ff8278; --d-logement:#6cc7b3; --d-voiture:#7fb2ee; --d-sante:#f58ab2;
  --d-banque:#9aa7ea; --d-energie:#f2b552; --d-famille:#6fd0d0; --d-travail:#d1ad7d; --d-assurances:#9ccc7e; --d-abonnements:#c9a1e3; --d-chomage:#f39a64; --d-loisirs:#5cc8e6;
  color-scheme:dark; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Shell ---------- */
.screen{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.topbar{display:flex;justify-content:flex-end;align-items:center;min-height:44px;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--surface)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.plus{background:var(--accent);color:var(--accent-ink)}
h1.large{font-family:var(--f-round);font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
h2.sect{font-size:20px;font-weight:700;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
h2.sect .n{font-size:14px;font-weight:600;color:var(--muted)}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabbar button{flex:1;max-width:120px;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabbar button svg{width:26px;height:26px}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* ---------- Cards & lists ---------- */
.hero{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:4px}
.hero b{font-family:var(--f-round);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.hero span{font-size:13px;color:var(--muted)}
.hero .late b{color:var(--late)} .hero .soon b{color:var(--soon)}
.allgood{background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:14px 16px;font-weight:600}

.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;min-height:60px;padding:8px 12px 8px 4px;position:relative}
.item + .item::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.check{width:44px;height:44px;display:grid;place-items:center}
.check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--muted));display:grid;place-items:center;transition:background .15s}
.check span svg{width:14px;height:14px;opacity:0;color:#fff}
.check:active span,.check.ticked span{background:var(--c)}
.check.ticked span svg{opacity:1}
.check[disabled] span{border-style:dashed;opacity:.6}
.item .main{min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:4px 0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.item .sub .dom{color:var(--c);font-weight:600}
.item .when{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);padding-left:6px}
.item .when b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.item.late .when b{color:var(--late)} .item.soon .when b{color:var(--soon)}
.chev{width:16px;height:16px;color:var(--muted)}

.empty{background:var(--surface);border-radius:var(--r);padding:24px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:40px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:16px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;border-radius:16px;padding:0 12px;background:var(--surface);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

.segmented{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:2px;margin-bottom:14px}
.segmented button{height:32px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.domgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:118px}
.dtile .ico{width:36px;height:36px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center}
.dtile .ico svg{width:20px;height:20px}
.dtile .nm{font-weight:700;font-size:15px;line-height:1.2}
.dtile .nx{font-size:12.5px;color:var(--muted);margin-top:auto}
.dtile.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:36px 1fr;align-items:center;column-gap:12px}
.dtile.wide .nx{grid-column:2;margin-top:-6px}
.dtile .nx.late{color:var(--late);font-weight:600}

.keep .row{padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.keep .row + .row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.keep .row b{font-weight:600}
.keep .row span{font-size:14px;color:var(--muted)}
.source{font-size:13px;color:var(--muted);margin:10px 4px}

.settings .cell{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;text-align:left;position:relative}
.settings .cell + .cell::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.settings .cell .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.settings .cell .ic svg{width:18px;height:18px}
.settings .cell .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.settings .cell .tx small{color:var(--muted);font-size:13px}
.settings .cell.danger{color:var(--late)}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0}
.warn{background:var(--soon-soft);color:var(--soon);border-radius:var(--r);padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.warn button{font-weight:700;color:inherit;text-decoration:underline}

/* ---------- Buttons ---------- */
.btn{height:50px;border-radius:12px;padding:0 18px;font-weight:600;font-size:17px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.danger{color:var(--late)}
.btn.small{height:38px;font-size:15px;border-radius:10px}
.linkbtn{color:var(--accent);font-weight:600;font-size:16px;padding:8px 0}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 8px;gap:8px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;text-align:center}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet-body{overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-body > *{flex-shrink:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}

.form{background:var(--surface);border-radius:var(--r);overflow:hidden}
.form .f{display:flex;flex-direction:column;padding:10px 14px;gap:2px;position:relative}
.form .f + .f::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.form label{font-size:13px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:none;background:none;outline:none;font-size:16px;padding:4px 0;width:100%;min-height:30px}
.form textarea{min-height:70px;resize:none}
.form .hint{font-size:12px;color:var(--muted)}
.domsel{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.domsel button{height:34px;border-radius:17px;padding:0 12px;background:var(--surface-2);font-size:14px;display:flex;align-items:center;gap:6px}
.domsel button[aria-pressed="true"]{background:var(--c);color:#fff}
.domsel button[aria-pressed="true"] .dot{background:#fff}

.detail-head{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.detail-head .pill{font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:4px 10px;border-radius:12px}
.detail-head h3{margin:0;font-size:24px;font-family:var(--f-round);line-height:1.15}
.kv{background:var(--surface);border-radius:var(--r)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;position:relative}
.kv div + div::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere;min-width:0}

.tpl{display:flex;flex-direction:column}
.tpl label{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 14px;align-items:start;position:relative}
.tpl label + label::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--line)}
.tpl input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.tpl small{display:block;color:var(--muted);font-size:13px}

/* ---------- Onboarding ---------- */
.onb{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.onb h1{font-family:var(--f-round);font-size:32px;line-height:1.1;margin:0;letter-spacing:-.02em}
.onb p.lead{margin:0;font-size:17px;color:var(--muted)}
.onb .steps{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.onb .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.situ{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.situ button{background:var(--surface);border-radius:var(--r);padding:14px 12px;min-height:84px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;font-weight:600;font-size:15px;line-height:1.2;border:2px solid transparent}
.situ button svg{width:24px;height:24px;color:var(--c)}
.situ button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.features{display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px}
.features div{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.features .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff}
.features .ic svg{width:20px;height:20px}
.features b{display:block}
.features span{font-size:14px;color:var(--muted)}

/* ---------- Parcours CSP ---------- */
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;font-weight:500;height:44px;margin-right:auto}
.back svg{width:20px;height:20px;transform:rotate(180deg)}
.lead2{color:var(--muted);margin:-6px 0 14px}
.cspcard{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;margin-top:12px;border-left:5px solid var(--d-chomage)}
.cspcard .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--d-chomage)}
.cspcard .t{font-weight:700;font-size:17px}
.cspcard .s{font-size:14px;color:var(--muted)}
.timeline{background:var(--surface);border-radius:var(--r);padding:6px 14px}
.ms{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.ms::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:2px solid var(--line)}
.ms:first-child::before{top:16px}.ms:last-child::before{bottom:calc(100% - 16px)}
.ms .pt{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--d-chomage);position:relative;margin-top:2px}
.ms.past .pt{background:var(--d-chomage)}
.ms.past .lbl{color:var(--muted)}
.ms.next .pt{box-shadow:0 0 0 4px color-mix(in srgb,var(--d-chomage) 25%,transparent)}
.ms .lbl{font-weight:600;font-size:15px}
.ms .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ms .dt{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.ms.next .dt{color:var(--d-chomage);font-weight:700}
.acc{background:var(--surface);border-radius:var(--r);overflow:hidden}
.acc details{position:relative}
.acc details + details::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.acc summary{list-style:none;padding:14px 40px 14px 14px;font-weight:600;cursor:pointer;position:relative}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.acc details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.acc .in{padding:0 14px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.acc .in p{margin:0}
.acc .in ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.acc .in .tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.disclaimer{font-size:13px;color:var(--muted);margin:12px 4px 0;display:flex;flex-direction:column;gap:6px}
.miss{color:var(--soon);font-weight:600}
.notecard{display:flex;flex-direction:column;gap:2px;padding:12px 14px;text-align:left;width:100%;position:relative}
.notecard + .notecard::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.notecard .t{font-weight:600}
.notecard .ex{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.notebody{background:var(--surface);border-radius:var(--r);padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.5}
.form textarea.big{min-height:280px;line-height:1.5}
.seg3{grid-template-columns:1fr 1fr 1fr}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* ---------- Bons plans : langage visuel « ticket » distinct des domaines ---------- */
:root{ --deal-a:#ffb85c; --deal-b:#ff7657; --deal-ink:#2b1306; --deal-soft:#fff1e6;
  --dc-voyage:#2c6fb8; --dc-sport:#2f7d6d; --dc-culture:#8a5ca8; --dc-event:#d0457a; --dc-aide:#c2571a; --dc-shopping:#a86500; --d-bonsplans:#e8623f; }
@media (prefers-color-scheme: dark){ :root{ --deal-a:#c9772a; --deal-b:#b8452f; --deal-ink:#fff4ea; --deal-soft:#33221a; --d-bonsplans:#ff8a66; } }
.ticket{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 18px 18px 22px;border-radius:16px;background:linear-gradient(115deg,var(--deal-a),var(--deal-b));color:var(--deal-ink);margin-bottom:16px;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);right:86px}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket .stamp{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}

function rel(s){ const n=daysTo(s); if(n<-1) return `retard ${-n} j`; if(n===-1) return "hier"; if(n===0) return "aujourd'hui"; if(n===1) return "demain"; if(n<45) return `dans ${n} j`; return `dans ${Math.round(n/30.4)} mois`; }
function nextFromMD(md){ const [m,d]=md.split("-").map(Number); const t=today(); let dt=new Date(t.getFullYear(),m-1,d); if(dt<t) dt=new Date(t.getFullYear()+1,m-1,d); return iso(dt); }

const CSP_SOURCES = [
  ["Service-public : le contrat de sécurisation professionnelle","https://www.service-public.gouv.fr/particuliers/vosdroits/F13819"],

const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const endOfMonth = s => { const d=parse(s); return iso(new Date(d.getFullYear(), d.getMonth()+1, 0)); };

function cspDates(c){
  const E = addDays(c.remise, 21);          // fin du délai de réflexion = fin du contrat
  const S = addDays(E, 1);                  // début du CSP et de l'ASP
  const A = c.signature || E;               // date d'acceptation
  return { D:c.remise, E, S, A, rdv:addDays(S,8), prime:addDays(addMonths(S,10),-1), fin:addDays(addMonths(S,12),-1), reemb:addMonths(E,12), conteste:addMonths(A,12), solde:addMonths(c.solde||E,6) };
}
function cspTasks(c){
  const d=cspDates(c);
  const t=[
    {tpl:"csp-decide", title:"Rendre le bulletin d'acceptation CSP signé", due:d.E, note:"21 jours calendaires après la remise du document CSP, sans possibilité de raccourcir. Sans réponse à la fin du délai, c'est un refus. Tu peux changer d'avis jusqu'à la fin du délai. Garde une copie signée.", done:!!c.signature, lastDone:c.signature||undefined},
    {tpl:"csp-motif", title:"Vérifier que j'ai l'écrit du motif économique", due:d.E, note:"L'employeur doit te le remettre au plus tard au moment où tu acceptes le CSP."},
    {tpl:"csp-fin", title:"Fin du contrat : récupérer mes documents", due:d.E, note:"Certificat de travail, attestation employeur, reçu pour solde de tout compte. Vérifie que l'indemnité de licenciement et l'indemnité de congés payés y figurent."},
    {tpl:"csp-reemb", title:"Demander ma priorité de réembauche par écrit", due:addDays(d.E,7), note:"Elle dure 1 an à partir de la fin du contrat, à condition de la demander. Lettre recommandée ou mail conseillé, garde une copie."},
    {tpl:"csp-rdv", title:"1er rendez-vous France Travail : plan de sécurisation", due:d.rdv, note:"Tu es convoqué(e) dans les 8 jours qui suivent le début du CSP. Après le RDV, crée une note « Récap RDV » dans l'appli."},
    {tpl:"csp-actu", title:"Actualisation mensuelle France Travail", due:endOfMonth(d.S), repeat:1, note:"Chaque mois, dans ton espace France Travail : ajuste la date à celle qui y est indiquée. Sans actualisation, l'ASP est suspendue et le CSP peut s'arrêter."},
    {tpl:"csp-asp", title:"Vérifier le 1er versement de l'ASP", due:addDays(endOfMonth(d.S),5), note:"L'ASP est versée à la fin de chaque mois, sans délai d'attente, si tu as fait ton actualisation."},
    {tpl:"csp-solde", title:"Limite pour contester le solde de tout compte", due:d.solde, note:"6 mois après la date où tu as signé le reçu (ajuste-la dans « Mes dates »). Contestation par lettre recommandée à l'employeur."},
    {tpl:"csp-prepa", title:"Préparer la sortie du CSP avec mon conseiller", due:addMonths(d.S,11)},
    {tpl:"csp-end", title:"Fin du CSP : m'inscrire comme demandeur d'emploi si besoin", due:d.fin, note:"Si tu n'as pas retrouvé d'emploi, l'ARE prend le relais sans délai d'attente. Sa durée est réduite des jours d'ASP déjà perçus."},
    {tpl:"csp-conteste", title:"Limite pour contester la rupture aux prud'hommes", due:d.conteste, note:"12 mois à partir de l'acceptation du CSP (motif économique, ordre des licenciements, procédure, information sur la priorité de réembauche). En cas de doute, consulte un syndicat ou un avocat bien avant."},
    {tpl:"csp-reemb-fin", title:"Fin de ma priorité de réembauche", due:d.reemb},
  ];
  if(c.anc1an) t.splice(8,0,{tpl:"csp-prime", title:"Limite pour toucher la prime de reclassement", due:d.prime, note:"Si tu reprends un emploi d'au moins 6 mois (CDI, CDD ou intérim) avant la fin du 10e mois de CSP : 50 % de tes droits ASP restants, versés en 2 fois. À demander dans les 30 jours après la reprise."});
  return t;
}

  ["csp-doc-info","Document d'information CSP et récépissé",""],
  ["csp-doc-bulletin","Bulletin d'acceptation CSP signé (copie)",""],

function cspApply(c){
  DB.settings.csp=c;
  for(const t of cspTasks(c)){
    const ex=DB.items.find(x=>x.tpl===t.tpl);
    const base={domain:"chomage", repeat:0, where:"", amount:"", note:""};
    if(ex){ Object.assign(ex, {title:t.title, due:(ex.repeat&&ex.lastDone)||(ex.done&&!t.done)?ex.due:t.due, note:t.note||"", repeat:t.repeat||0}); if(t.done){ ex.done=true; ex.lastDone=t.lastDone; } }
    else DB.items.push({...base, ...t, repeat:t.repeat||0, id:uid(), updatedAt:iso(new Date())});
  }
  if(!c.anc1an) DB.items=DB.items.filter(x=>x.tpl!=="csp-prime");
  for(const [tpl,title,keep] of CSP_DOCS){ if(!DB.docs.some(x=>x.tpl===tpl)) DB.docs.push({id:uid(),tpl,title,domain:"chomage",where:"",date:null,keep,updatedAt:iso(new Date())}); }
  persist();
}

  return {
    late:dated.filter(x=>daysTo(x.due)<0),

    quarter:dated.filter(x=>{const n=daysTo(x.due);return n>30&&n<=92;}),
    later:dated.filter(x=>daysTo(x.due)>92),

  }
  if(!DB.docs.length) return h + `<div class="empty"><p>Ici, tu ne ranges pas le papier lui-même : tu notes <b>où il est</b> (un dossier Fichiers, ton espace impots.gouv, « classeur bleu, intercalaire Voiture »). Tu le retrouves ensuite en quelques secondes.</p>
    <p>Commence par les plus recherchés : avis d'impôt, carte grise, bail ou titre de propriété, attestation de mutuelle, RIB.</p>
    <button class="btn primary" data-act="add-doc">Noter un document</button></div>`;
  const list=filt(DB.docs).sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  h += searchBox("Rechercher un document") + chips();
  h += list.length ? `<div class="list">${list.map(x=>{const d=DOM[x.domain]||{n:"Autre"};return `<div class="item" style="--c:var(--d-${esc(x.domain)});grid-template-columns:44px minmax(0,1fr) auto">
      <span class="check"><span style="border:none;background:var(--c);color:#fff;border-radius:8px;width:28px;height:28px">${ico(x.domain,'style="width:16px;height:16px;opacity:1"')}</span></span>
      <button class="main" data-doc="${esc(x.id)}"><span class="t">${esc(x.title)}</span><span class="sub">${x.where?esc(x.where):`<span class="miss">À récupérer · touche pour noter où il est</span>`}</span></button>

    : `<div class="empty"><p>Aucun document pour ce filtre.</p></div>`;
  return h;
}

function curDom(fallback){ return UI.tab==="domain" ? UI.domKey : (UI.dom!=="all" ? UI.dom : fallback); }
function docRow(x){
  return `<div class="item" style="--c:var(--d-${esc(x.domain)})"><span class="check ${x.where?"ticked":""}"><span>${ico("check",'stroke-width="3"')}</span></span><button class="main" data-doc="${esc(x.id)}"><span class="t">${esc(x.title)}</span><span class="sub">${x.where?esc(x.where):`<span class="miss">À récupérer · touche pour noter où il est</span>`}</span></button><span></span></div>`;
}
function faqHTML(k){
  const info=DOMAIN_INFO[k]||{faq:[]};
  const keep=KEEP.filter(r=>r[0]===k);
  const items=[...info.faq];
  if(keep.length) items.push({q:"Combien de temps garder mes papiers ?", a:`<ul>${keep.map(r=>`<li><b>${esc(r[1])}</b> : ${esc(r[2])}</li>`).join("")}</ul>`, src:[["Combien de temps conserver ses papiers",KEEP_URL]]});
  if(!items.length) return "";
  return `<h2 class="sect">À savoir</h2><div class="acc">${items.map(f=>`<details><summary>${esc(f.q)}</summary><div class="in">${f.a}<p class="small muted">Source : ${f.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</p></div></details>`).join("")}</div>
    <p class="note">Règles générales vérifiées sur service-public.gouv.fr le 23 novembre 2026. Ta situation peut avoir des particularités.</p>`;
}

function viewDomain(){
  const k=UI.domKey, d=DOM[k]; if(!d){ UI.tab="domains"; return viewDomains(); }
  const info=DOMAIN_INFO[k]||{docs:[],faq:[]};
  let h = `<div class="topbar"><button class="back" data-tab="domains">${ico("chev")}Domaines</button><button class="iconbtn plus" data-act="add" aria-label="Ajouter dans ${esc(d.n)}">${ico("plus")}</button></div>
    <div style="display:flex;align-items:center;gap:12px;margin:2px 0 14px"><span class="dtile" style="--c:var(--d-${k});padding:0;min-height:0;background:none"><span class="ico" style="width:44px;height:44px;border-radius:12px">${ico(k)}</span></span><h1 class="large" style="margin:0;font-size:30px">${esc(d.n)}</h1></div>`;
  if(k==="chomage") return h + cspBlocks();
  if(k==="loisirs") return h + loisirsBlocks();
  if(info.intro) h += `<p class="lead2">${esc(info.intro)}</p>`;

  // Mes dates
  const open=DB.items.filter(x=>x.domain===k&&!x.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const done=DB.items.filter(x=>x.domain===k&&x.done);
  h += `<h2 class="sect" style="margin-top:4px">Mes dates <span class="n">${open.length}</span></h2>`;
  h += open.length ? `<div class="list">${open.map(itemRow).join("")}</div>` : `<div class="empty"><p>Aucune date pour l'instant.</p></div>`;
  const hasTpl=TPL.some(t=>t.d===k);
  h += `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small" data-act="add-item">+ Une date</button>${hasTpl?`<button class="btn small" data-act="templates-dom">Choisir dans les modèles</button>`:""}</div>`;
  if(done.length) h += `<details style="margin-top:10px"><summary class="small muted">${done.length} terminée(s)</summary><div class="list" style="margin-top:8px">${done.map(x=>`<div class="item" style="--c:var(--d-${esc(x.domain)})"><span class="check ticked"><span>${ico("check",'stroke-width="3"')}</span></span><button class="main" data-open="${esc(x.id)}"><span class="t">${esc(x.title)}</span><span class="sub">Fait le ${esc(fmt(x.lastDone))}</span></button><span></span></div>`).join("")}</div></details>`;

  // Mes papiers + suggestions
  const docs=DB.docs.filter(x=>x.domain===k).sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  const sugg=(info.docs||[]).map((t,i)=>({tpl:`sug-${k}-${i}`,t})).filter(s=>!DB.docs.some(x=>x.tpl===s.tpl||x.title===s.t));
  const miss=docs.filter(x=>!x.where).length;
  h += `<h2 class="sect">Mes papiers <span class="n">${docs.length?`${docs.length-miss}/${docs.length} rangés`:""}</span></h2>`;
  h += docs.length ? `<div class="list">${docs.map(docRow).join("")}</div>` : `<div class="empty"><p>Note ici où se trouve chaque papier (dossier Fichiers, espace en ligne, classeur papier) pour le retrouver en quelques secondes.</p></div>`;
  if(sugg.length) h += `<p class="small muted" style="margin:14px 4px 6px">Papiers utiles à avoir sous la main : touche pour l'ajouter</p><div class="chips" style="flex-wrap:wrap;margin:0;padding:0">${sugg.map(s=>`<button class="chip" data-sugg="${esc(s.tpl)}" style="--c:var(--d-${k})">+ ${esc(s.t)}</button>`).join("")}</div>`;
  h += `<div style="margin-top:10px"><button class="btn small" data-act="add-doc">+ Un autre papier</button></div>`;

  // Notes
  const notes=DB.notes.filter(n=>n.domain===k).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  h += `<h2 class="sect">Mes notes <span class="n">${notes.length||""}</span></h2>`;
  h += notes.length ? notesList(notes) : `<div class="empty"><p>Un numéro de contrat, le nom d'un interlocuteur, le récap d'un appel…</p></div>`;
  h += `<div style="margin-top:10px"><button class="btn small" data-act="add-note">+ Une note</button></div>`;

  h += faqHTML(k);
  if(d.links.length) h += `<p class="note">Sites utiles : ${d.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</p>`;
  return h;
}

function cspBlocks(){
  const c=DB.settings.csp;
  let h = "";
  if(!c){
    h += `<p class="lead2">Licenciement économique avec contrat de sécurisation professionnelle : l'appli calcule toutes tes dates clés à partir d'une seule date, celle où ton employeur t'a remis le document d'information CSP.</p>
      <button class="btn primary block" data-act="csp-setup">Créer mon parcours CSP</button>`;
  } else {
    const d=cspDates(c), t=iso(today());
    const ms=[
      [d.D,"Remise du document CSP","Début du délai de réflexion de 21 jours"],
      [d.E,"Fin du délai de réflexion et du contrat","Dernier jour pour rendre le bulletin signé"],
      [d.S,"Début du CSP et de l'ASP","12 mois d'accompagnement, sans délai d'attente"],
      [d.rdv,"1er rendez-vous France Travail","Au plus tard 8 jours après le début du CSP"],
      ...(c.anc1an?[[d.prime,"Fin du 10e mois","Limite pour la prime de reclassement"]]:[]),
      [d.fin,"Fin du CSP","Bascule vers l'ARE si besoin"],
      [d.reemb,"Fin de la priorité de réembauche","1 an après la fin du contrat"],
      [d.conteste,"Limite pour contester la rupture","12 mois après l'acceptation du CSP"],
    ].sort((a,b)=>a[0].localeCompare(b[0]));
    const nextI=ms.findIndex(m=>m[0]>=t);
    h += `<h2 class="sect" style="margin-top:4px">Mes dates clés</h2><div class="timeline">${ms.map((m,i)=>`<div class="ms ${m[0]<t?"past":""} ${i===nextI?"next":""}"><span class="pt"></span><span class="lbl">${esc(m[1])}<small>${esc(m[2])}</small></span><span class="dt">${esc(fmt(m[0]))}${i===nextI?`<br>${esc(rel(m[0]))}`:""}</span></div>`).join("")}</div>
      <p class="note">Calculé à partir de la remise du document CSP le ${esc(fmt(c.remise))}. <button class="linkbtn" data-act="csp-setup" style="padding:0;font-size:13px">Modifier mes dates</button></p>`;
    const todo=DB.items.filter(x=>x.domain==="chomage"&&!x.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
    h += `<h2 class="sect">Mes démarches <span class="n">${todo.length}</span></h2>${todo.length?`<div class="list">${todo.map(itemRow).join("")}</div>`:`<div class="allgood">Toutes les démarches sont faites.</div>`}`;
    const docs=DB.docs.filter(x=>x.domain==="chomage"), miss=docs.filter(x=>!x.where).length;
    h += `<h2 class="sect">Mes papiers <span class="n">${docs.length-miss}/${docs.length} rangés</span></h2>
      <div class="list">${docs.map(docRow).join("")}</div><div style="margin-top:10px"><button class="btn small" data-act="add-doc">+ Un autre papier</button></div>`;
  }
  const notes=DB.notes.filter(n=>n.domain==="chomage").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  h += `<h2 class="sect">Mes notes de RDV <span class="n">${notes.length}</span></h2>`;
  h += notes.length ? notesList(notes) : `<div class="empty"><p>Après chaque rendez-vous avec ton conseiller, note ce qui a été dit et ce que tu dois faire. Le modèle contient déjà les bonnes questions à poser.</p></div>`;
  h += `<button class="btn block primary" data-act="add-note-rdv" style="margin-top:10px">Nouveau récap de RDV</button>`;
  h += `<h2 class="sect">Mes droits, en clair</h2>${cspRights(c)}

}

function cspRights(c){
  const anc = c ? c.anc1an : null;
  return `<div class="acc">
  <details><summary>Le délai de réflexion (21 jours)</summary><div class="in">
    <ul><li>21 jours calendaires, à partir du lendemain de la remise du document CSP. Ils ne peuvent pas être raccourcis.</li>
    <li>Tu peux changer d'avis jusqu'au dernier jour.</li>
    <li>Sans réponse à la fin du délai, c'est un <b>refus</b> : l'employeur fait alors un licenciement économique classique.</li>
    <li>Pendant ce délai, tu peux demander un entretien d'information à France Travail.</li>
    <li>L'employeur doit te remettre un écrit qui explique le motif économique, au plus tard au moment où tu acceptes.</li></ul>
    <p class="tip">Pour accepter : remplis et signe le bulletin d'acceptation, rends-le à ton employeur avant la fin du délai et garde une copie.</p></div></details>
  <details><summary>Ton argent à la fin du contrat</summary><div class="in">
    <ul><li>Le contrat s'arrête à la fin du délai de réflexion. Tu n'as pas de préavis à effectuer.</li>
    <li>Tu touches ton <b>indemnité de licenciement</b> (si tu as l'ancienneté requise) et ton <b>indemnité de congés payés</b>.</li>
    <li><b>Préavis</b> ${anc===true?"(ton cas : au moins 1 an d'ancienneté)":anc===false?"(ton cas : moins d'1 an d'ancienneté)":""} :
      <ul>${anc!==false?`<li>Avec au moins 1 an d'ancienneté, l'employeur verse 3 mois de préavis à France Travail pour financer ton CSP. Si ton préavis dépasse 3 mois, le surplus t'est versé.</li>`:""}
      ${anc!==true?`<li>Avec moins d'1 an d'ancienneté, tu touches toute ton indemnité de préavis.</li>`:""}</ul></li></ul>
    <p class="tip">Compare le reçu pour solde de tout compte avec tes bulletins de salaire. Tu as 6 mois après la signature pour contester un montant.</p></div></details>
  <details><summary>L'ASP, ton allocation pendant le CSP</summary><div class="in">
    <ul>${anc!==false?`<li>Avec au moins 1 an d'ancienneté : <b>75 % de ton salaire journalier de référence</b>, jamais moins que l'allocation chômage classique (ARE), et sans baisse au fil des mois.</li>`:""}
    ${anc!==true?`<li>Avec moins d'1 an d'ancienneté : le même montant que l'ARE.</li>`:""}
    <li>Versée <b>dès le lendemain de la fin du contrat</b>, sans délai d'attente.</li>
    <li>Pendant 12 mois au maximum, versée à la fin de chaque mois si tu as fait ton actualisation.</li>
    <li>Elle est <b>imposable</b> : pense à la déclarer aux impôts.</li></ul>
    <p class="tip">Demande le montant exact à ton conseiller dès le 1er rendez-vous.</p></div></details>
  <details><summary>Pendant le CSP : accompagnement et obligations</summary><div class="in">
    <ul><li>12 mois d'accompagnement renforcé avec un conseiller référent (France Travail ou un organisme partenaire) et un plan de sécurisation professionnelle.</li>
    <li>Tu peux suivre des formations, et tu as le statut de stagiaire de la formation professionnelle.</li>
    <li><b>Tes obligations</b> : t'actualiser chaque mois, venir aux rendez-vous, faire valider tes activités par ton conseiller.</li>
    <li>Le CSP peut s'arrêter si tu refuses sans motif légitime une action de reclassement ou de formation, si tu refuses deux fois une offre raisonnable d'emploi, ou en cas de fausse déclaration.</li>
    <li>Un arrêt maladie indemnisé ou certains congés (parental, proche aidant…) suspendent l'ASP pendant leur durée.</li></ul></div></details>
  <details><summary>Travailler pendant le CSP</summary><div class="in">
    <ul><li>Tu peux faire des CDD ou des missions d'intérim de <b>3 jours à moins de 6 mois</b> (6 mois au total au maximum). Le CSP et l'ASP s'arrêtent pendant le contrat, puis reprennent pour la durée qui restait.</li>
    <li>Pour un contrat à partir du 7e mois, le CSP est prolongé (jusqu'à 3 mois).</li>
    <li>Un CDI, ou un CDD ou un intérim d'au moins 6 mois, met fin au CSP. Si le contrat est rompu pendant la période d'essai, tu peux reprendre le CSP.</li></ul>
    <p class="tip">Fais toujours valider un contrat par ton conseiller avant de le commencer.</p></div></details>
  <details><summary>Retrouver un emploi : primes possibles</summary><div class="in">
    <ul>${anc!==false?`<li><b>Prime de reclassement</b> : si tu reprends un emploi d'au moins 6 mois (CDI, CDD ou intérim) <b>avant la fin du 10e mois</b> de CSP, tu touches 50 % de tes droits ASP restants, en 2 fois. Elle est réservée aux personnes avec au moins 1 an d'ancienneté. À demander dans les 30 jours après la reprise.</li>`:""}
    <li><b>Indemnité différentielle de reclassement</b> : si ton nouvel emploi est moins payé que l'ancien, France Travail peut compenser une partie de la différence, pendant 12 mois maximum. À demander à France Travail.</li>
    <li>Ces deux aides ne se cumulent pas pour un même emploi.</li></ul></div></details>
  <details><summary>À la fin du CSP</summary><div class="in">
    <ul><li>Si tu n'as pas retrouvé d'emploi, inscris-toi comme demandeur d'emploi (procédure simplifiée). L'ARE prend le relais <b>sans délai d'attente</b>.</li>
    <li>La durée de l'ARE est réduite du nombre de jours d'ASP déjà perçus.</li></ul></div></details>
  <details><summary>Tes recours et tes délais</summary><div class="in">
    <ul><li><b>Contester la rupture</b> (motif économique, ordre des licenciements, procédure, absence d'information sur la priorité de réembauche) : 12 mois après l'acceptation du CSP, devant le conseil de prud'hommes.</li>
    <li><b>Solde de tout compte</b> : 6 mois après la signature du reçu, par lettre recommandée à l'employeur.</li>
    <li><b>Priorité de réembauche</b> : pendant 1 an après la fin du contrat, si tu la demandes. Fais ta demande par écrit.</li></ul>
    <p class="tip">Un syndicat, un défenseur syndical ou un avocat en droit du travail peut relire ta lettre de licenciement et ton solde de tout compte avec toi.</p></div></details>
  </div>`;
}

function jobLast(j){ const l=[...(j.log||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]; return l||null; }
function jobFiltered(){
  const q=UI.q.trim().toLowerCase();

function viewJobs(){
  UI.jCity=UI.jCity||"all"; UI.jMet=UI.jMet||"all"; UI.jSt=UI.jSt||"all";
  let h = `<div class="topbar">${DB.jobs.length?`<button class="iconbtn" data-act="job-recap" aria-label="Récap pour mon conseiller">${ico("share")}</button>`:""}<button class="iconbtn plus" data-act="job-new" aria-label="Ajouter une entreprise">${ico("plus")}</button></div><h1 class="large">Candidatures</h1>`;
  if(!DB.jobs.length) return h + `<div class="empty"><p>Ajoute ici les entreprises à contacter : agences, studios, services communication… Pour chacune, tu notes tes échanges (mail, téléphone, sur place), tes entretiens, les contacts, le lien de l'offre et ce que tu sais de la boîte.</p>
    <p>Les réponses négatives partent dans les archives pour garder une liste claire.</p>
    <button class="btn primary" data-act="job-new">Ajouter une première entreprise</button></div>`;
  const all=jobFiltered(), active=all.filter(j=>!j.archived), arch=all.filter(j=>j.archived);
  const cnt=k=>active.filter(j=>(j.status||"todo")===k).length;
  h += `<div class="jstats">${["todo","sent","interview","yes"].map(k=>`<button data-jst="${k}" aria-pressed="${UI.jSt===k}" style="--c:${stC(k)}"><b>${cnt(k)}</b><span>${JSTN[k].short}</span></button>`).join("")}</div>`;
  h += `<div style="margin-top:12px">${searchBox("Entreprise, poste, contact…")}</div>`;
  const cities=[...new Set([...CITIES.filter(c=>DB.jobs.some(j=>j.city===c)), ...DB.jobs.map(j=>j.city).filter(Boolean)])];
  const mets=[...new Set(DB.jobs.map(j=>j.metier).filter(Boolean))].sort();
  if(cities.length>1||UI.jCity!=="all") h += `<div class="fl"><span class="lab">Ville</span><button class="chip" data-jcity="all" aria-pressed="${UI.jCity==="all"}">Toutes</button>${cities.map(c=>`<button class="chip" data-jcity="${esc(c)}" aria-pressed="${UI.jCity===c}">${esc(c)}</button>`).join("")}</div>`;
  if(mets.length>1||UI.jMet!=="all") h += `<div class="fl"><span class="lab">Métier</span><button class="chip" data-jmet="all" aria-pressed="${UI.jMet==="all"}">Tous</button>${mets.map(m=>`<button class="chip" data-jmet="${esc(m)}" aria-pressed="${UI.jMet===m}">${esc(m)}</button>`).join("")}</div>`;
  const order=["interview","sent","todo","yes"].filter(k=>UI.jSt==="all"||UI.jSt===k);
  let any=false;
  for(const k of order){
    const arr=active.filter(j=>(j.status||"todo")===k).sort((a,b)=>(a.next||"9999").localeCompare(b.next||"9999")||(b.updatedAt||"").localeCompare(a.updatedAt||""));
    if(!arr.length) continue; any=true;
    h += `<h2 class="sect">${JSTN[k].short} <span class="n">${arr.length}</span></h2><div class="list">${arr.map(jobRow).join("")}</div>`;
  }
  if(!any) h += `<div class="empty" style="margin-top:14px"><p>Aucune entreprise pour ce filtre.</p></div>`;
  if(UI.jSt!=="all") h += `<button class="linkbtn" data-jst="all" style="margin-top:6px">Voir tous les statuts</button>`;
  if(arch.length) h += `<details style="margin-top:18px"><summary class="sect" style="font-size:17px;font-weight:700;cursor:pointer;list-style:none">Archives <span class="n">${arch.length}</span></summary><div class="list" style="margin-top:8px">${arch.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||"")).map(jobRow).join("")}</div></details>`;
  return h;
}

function syncJobItems(j){
  const want=[];
  if(!j.archived && j.next) want.push({tpl:`job-next-${j.id}`, title:`${j.nextLabel||"Relancer"} : ${j.company}`, due:j.next, note:[j.role,j.city].filter(Boolean).join(" · ")});
  if(!j.archived) for(const it of (j.interviews||[])) if(it.date && daysTo(it.date)>=0) want.push({tpl:`job-int-${j.id}-${it.id}`, title:`Entretien : ${j.company}${it.time?` à ${it.time}`:""}`, due:it.date, note:[FORMATS.find(f=>f[0]===it.format)?.[1], it.with].filter(Boolean).join(" · ")});
  const prefix=[`job-next-${j.id}`,`job-int-${j.id}-`];
  DB.items=DB.items.filter(x=>!(x.tpl && prefix.some(p=>x.tpl.startsWith(p)) && !want.some(w=>w.tpl===x.tpl)));
  for(const w of want){ const ex=DB.items.find(x=>x.tpl===w.tpl); if(ex) Object.assign(ex,{title:w.title,due:w.due,note:w.note,done:false}); else DB.items.push({id:uid(),domain:"chomage",repeat:0,where:"",amount:"",...w,jobId:j.id,updatedAt:iso(new Date())}); }
}

function setJobStatus(id, st){
  const j=DB.jobs.find(x=>x.id===id); if(!j) return;
  const before=JSON.parse(JSON.stringify(j));
  j.status=st;
  if(st==="no"){ j.archived=true; j.next=null; }
  if(st!=="no" && before.status==="no") j.archived=false;
  saveJob(j); render(); openJob(id);
  const undo=()=>{ const i=DB.jobs.findIndex(x=>x.id===id); DB.jobs[i]=before; syncJobItems(before); persist(); render(); openJob(id); };
  if(st==="no") toast("Réponse négative : archivée", undo);
  else if(st==="yes") toast("Bravo ! Pense à prévenir ton conseiller France Travail.", undo);
  else toast(`Statut : ${JSTN[st].n}`, undo);
}

function saveJobSub(){
  const {kind, jobId, sub}=EDIT; const j=DB.jobs.find(x=>x.id===jobId); if(!j) return;
  const listKey={log:"log",int:"interviews",ctc:"contacts"}[kind];
  let o={...sub};
  if(kind==="log") Object.assign(o,{channel:picked("pk-chan")||"other", date:$("#s-date").value||iso(today()), with:$("#s-with").value.trim(), note:$("#s-note").value});
  if(kind==="int") Object.assign(o,{format:picked("pk-fmt")||"place", date:$("#s-date").value||null, time:$("#s-time").value, with:$("#s-with").value.trim(), note:$("#s-note").value});
  if(kind==="ctc"){ const name=$("#s-name").value.trim(); if(!name){ $("#s-name").focus(); return; } const li=$("#s-li").value.trim(); Object.assign(o,{name, position:$("#s-pos").value.trim(), email:$("#s-mail").value.trim(), phone:$("#s-tel").value.trim(), linkedin:li&&!/^https?:\/\//i.test(li)?"https://"+li:li}); }
  const arr=[...(j[listKey]||[])]; const i=arr.findIndex(x=>x.id===o.id); if(i>=0) arr[i]=o; else arr.push(o); j[listKey]=arr;
  if(kind==="log" && (j.status||"todo")==="todo") j.status="sent";
  if(kind==="int" && ["todo","sent"].includes(j.status||"todo")) j.status="interview";
  saveJob(j); render(); openJob(jobId);
  toast(kind==="log"?"Échange noté":kind==="int"?"Entretien noté":"Contact enregistré");
}
function delJobSub(){
  const {kind, jobId, sub}=EDIT; const j=DB.jobs.find(x=>x.id===jobId); if(!j) return;
  const listKey={log:"log",int:"interviews",ctc:"contacts"}[kind];
  j[listKey]=(j[listKey]||[]).filter(x=>x.id!==sub.id); saveJob(j); render(); openJob(jobId);
}

function ageLimit(years){ const b=prof().birth; if(!/^\d{4}-\d{2}$/.test(b)) return null; const [y,m]=b.split("-").map(Number); return iso(new Date(y+years, m-1, 1)); }

function suggOk(sg){
  const p=prof(), hidden=DB.settings.hiddenSugg||[];
  if(hidden.includes(sg.id)) return false;
  if(sg.until && daysTo(sg.until)<0) return false;
  if(sg.u26){ const l=ageLimit(26); if(l && daysTo(l)<0) return false; }
  if(sg.u28){ const l=ageLimit(28); if(l && daysTo(l)<0) return false; }
  if(sg.cat && !p.interests.includes(sg.cat) && !(sg.cat==="event"&&p.interests.includes("culture"))) return false;
  if(sg.place!=="Partout" && sg.place!=="Région" && !p.places.includes(sg.place)) return false;
  return true;
}
function dealsSoon(){ return (DB.deals||[]).filter(d=>!d.used && d.end && daysTo(d.end)>=0 && daysTo(d.end)<=7); }

function dealTicket(){
  const saved=(DB.deals||[]).filter(d=>!d.used && (!d.end||daysTo(d.end)>=0)).length;
  const sugg=SUGG.filter(suggOk).length, soon=dealsSoon().length + SUGG.filter(s=>suggOk(s)&&s.hot).length;
  return `<button class="ticket" data-act="open-deals"><span><span class="stamp">Réductions · sorties</span><span class="big" style="display:block">Bons plans</span><span class="sm" style="display:block">${soon?`${soon} à saisir rapidement`:`${sugg} idées pour toi`}${saved?` · ${saved} gardé(s)`:""}</span></span>
    <span class="stub"><b>${sugg+saved}</b><span>plans</span></span></button>`;
}

function couponSugg(sg){
  const c=DCAT[sg.cat]; const saved=(DB.deals||[]).some(d=>d.fromSugg===sg.id);
  const tags=[sg.hot?`<span class="tagp hot">Jusqu'au ${esc(fmt(sg.until,{day:"numeric",month:"short"}))}</span>`:"", sg.start?`<span class="tagp hot">${esc(fmt(sg.start,{day:"numeric",month:"short"}))} → ${esc(fmt(sg.until,{day:"numeric",month:"short"}))}</span>`:"",
    sg.u26?`<span class="tagp u26">Moins de 26 ans</span>`:"", sg.u28?`<span class="tagp u26">Jusqu'à 27 ans</span>`:"", `<span class="tagp">${esc(sg.place)}</span>`, `<span class="tagp">${esc(c.n)}</span>`].join("");
  return `<article class="coupon" style="--c:var(--dc-${sg.cat})"><div class="lft">${ico(c.i)}</div><div class="bd">
    <div class="tags">${tags}</div><span class="tt">${esc(sg.t)}</span><div class="tx">${sg.tx}</div>
    ${sg.cav?`<p class="cav">${esc(sg.cav)}</p>`:""}
    <p class="src">Vérifié le 23 nov. 2026 · source : ${esc(sg.src)}</p>
    <div class="act"><a class="btn go" href="${esc(sg.url)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Voir l'offre</a>
      ${saved?`<span class="tagp ok">Gardé</span>`:`<button class="btn" data-sugg-save="${sg.id}">Garder</button>`}
      ${["voyage","sport","event","culture"].includes(sg.cat)?(DB.items.some(x=>isWish(x)&&x.fromDeal==="s:"+sg.id)?`<span class="tagp ok">Dans mes envies</span>`:`<button class="btn" data-wish-from-sugg="${sg.id}">+ Mes envies</button>`):""}
      <button class="btn" data-sugg-hide="${sg.id}" style="background:none;color:var(--muted)">Pas pour moi</button></div></div></article>`;
}
function couponDeal(d){
  const c=DCAT[d.cat]||DCAT.shopping; const u=safeUrl(d.url);
  const st=d.used?`<span class="tagp ok">Utilisé</span>`:d.end&&daysTo(d.end)<0?`<span class="tagp">Expiré</span>`:d.end?`<span class="tagp ${daysTo(d.end)<=7?"hot":""}">${daysTo(d.end)<=7?"Expire ":"Jusqu'au "}${esc(daysTo(d.end)<=7?rel(d.end):fmt(d.end,{day:"numeric",month:"short"}))}</span>`:"";
  return `<article class="coupon" style="--c:var(--dc-${esc(d.cat||"shopping")})"><div class="lft">${ico(c.i)}</div><div class="bd">
    <div class="tags">${st}${d.start&&daysTo(d.start)>0?`<span class="tagp">Dès le ${esc(fmt(d.start,{day:"numeric",month:"short"}))}</span>`:""}${d.place?`<span class="tagp">${esc(d.place)}</span>`:""}<span class="tagp">${esc(c.n)}</span></div>
    <span class="tt">${esc(d.title)}</span>
    ${d.code?`<span><span class="code">${esc(d.code)}</span> <button class="linkbtn" data-copy="${esc(d.code)}" style="font-size:14px;padding:0 0 0 6px">Copier</button></span>`:""}
    ${d.note?`<p class="tx" style="white-space:pre-wrap;color:var(--muted)">${esc(d.note)}</p>`:""}
    <div class="act">${u?`<a class="btn go" href="${esc(u)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Ouvrir</a>`:""}
      ${d.used?"":`<button class="btn" data-deal-used="${esc(d.id)}">J'en ai profité</button>`}${!d.used&&["voyage","sport","event","culture"].includes(d.cat)&&!DB.items.some(x=>isWish(x)&&x.fromDeal==="d:"+d.id)?`<button class="btn" data-wish-from-deal="${esc(d.id)}">+ Mes envies</button>`:""}<button class="btn" data-deal-edit="${esc(d.id)}" style="background:none;color:var(--muted)">Modifier</button></div></div></article>`;
}

function viewDeals(){
  UI.dealSeg=UI.dealSeg||"foryou"; UI.dealCat=UI.dealCat||"all";
  const p=prof();
  let h=`<div class="dealhead"><div class="topbar"><button class="back" data-tab="domains">${ico("chev")}Domaines</button><button class="iconbtn" data-act="deal-new" aria-label="Ajouter un bon plan">${ico("plus")}</button></div>
    <h1>Bons plans</h1><p>Réductions, sorties, voyages : tout ce qui allège le budget.</p>
    <div class="dseg" role="group"><button data-dseg="foryou" aria-pressed="${UI.dealSeg==="foryou"}">Pour toi</button><button data-dseg="mine" aria-pressed="${UI.dealSeg==="mine"}">Mes plans</button><button data-dseg="profile" aria-pressed="${UI.dealSeg==="profile"}">Mon profil</button></div></div>`;
  if(UI.dealSeg==="profile") return h+dealProfile();
  if(UI.dealSeg==="mine"){
    const all=DB.deals||[];
    if(!all.length) return h+`<div class="empty"><p>Garde ici les bons plans que tu croises : un code promo, une offre avec date limite, un événement, un lien vers un site de réductions… L'appli te rappelle ceux qui vont expirer.</p><button class="btn primary" data-act="deal-new">Ajouter un bon plan</button></div>`;
    const list=all.filter(d=>UI.dealCat==="all"||d.cat===UI.dealCat);
    const active=list.filter(d=>!d.used&&(!d.end||daysTo(d.end)>=0)).sort((a,b)=>(a.end||"9999").localeCompare(b.end||"9999"));
    const past=list.filter(d=>d.used||(d.end&&daysTo(d.end)<0));
    h+=`<div class="chips" style="margin-bottom:12px"><button class="chip" data-dcat="all" aria-pressed="${UI.dealCat==="all"}">Tous</button>${DCATS.map(c=>`<button class="chip" data-dcat="${c.k}" aria-pressed="${UI.dealCat===c.k}" style="--c:var(--dc-${c.k})"><span class="dot"></span>${esc(c.n)}</button>`).join("")}</div>`;
    h+= active.length?active.map(couponDeal).join(""):`<div class="empty"><p>Rien d'actif dans cette catégorie.</p></div>`;
    if(past.length) h+=`<details style="margin-top:16px"><summary class="small muted" style="cursor:pointer">${past.length} utilisé(s) ou expiré(s)</summary><div style="margin-top:10px">${past.map(couponDeal).join("")}</div></details>`;
    return h;
  }
  // Pour toi
  const l26=ageLimit(26);
  if(!p.birth) h+=`<div class="u26bar"><b>Jusqu'à quand as-tu droit aux tarifs -26 ans ?</b><span class="small">Indique ton mois de naissance dans « Mon profil » : l'appli te préviendra avant que ces réductions s'arrêtent. L'info reste sur ton téléphone.</span><button class="linkbtn" data-dseg="profile" style="align-self:flex-start;padding:0">Ajouter mon mois de naissance</button></div>`;
  else if(l26 && daysTo(l26)>=0){ const m=monthsUntil(l26); h+=`<div class="u26bar"><b>Encore ${m} mois de tarifs -26 ans</b><div class="meter"><i style="width:${Math.max(4,Math.min(100,100-(m/12)*100))}%"></i></div><span class="small">Ils s'arrêtent à tes 26 ans, en ${esc(fmt(l26,{month:"long",year:"numeric"}))}. Profite des cartes et gratuités marquées « Moins de 26 ans » d'ici là.</span></div>`; }
  const ok=SUGG.filter(suggOk);
  const hot=ok.filter(s=>s.hot||(s.start&&daysTo(s.start)<=30));
  const rest=ok.filter(s=>!hot.includes(s));
  const soon=dealsSoon();
  if(hot.length||soon.length) h+=`<h2 class="sect">À ne pas rater</h2>${soon.map(couponDeal).join("")}${hot.map(couponSugg).join("")}`;
  const order=["aide","voyage","culture","event","sport","shopping"];
  for(const k of order){ const arr=rest.filter(s=>s.cat===k); if(!arr.length) continue; h+=`<h2 class="sect">${esc(DCAT[k].n)}</h2>${arr.map(couponSugg).join("")}`; }
  const ideas=IDEAS.filter(i=>p.interests.includes(i.cat));
  if(ideas.length) h+=`<h2 class="sect">Idées à creuser</h2><div class="tips">${ideas.map(i=>`<div>${ico("bulb")}<span>${esc(i.t)}</span></div>`).join("")}</div><p class="note">Ce sont des pistes, pas des offres vérifiées.</p>`;
  if((DB.settings.hiddenSugg||[]).length) h+=`<button class="linkbtn" data-act="sugg-unhide" style="margin-top:8px">Réafficher les plans masqués (${DB.settings.hiddenSugg.length})</button>`;
  h+=`<p class="note">Les offres changent souvent : vérifie toujours les conditions sur le site avant d'acheter. Ces suggestions ont été vérifiées le 23 novembre 2026.</p>`;
  return h;
}

function dealProfile(){
  const p=prof();
  const multi=(key,opts)=>`<div class="multi" data-pgroup="${key}">${opts.map(([v,l])=>`<button type="button" data-pval="${esc(v)}" aria-pressed="${(p[key]||[]).includes(v)}">${esc(l)}</button>`).join("")}</div>`;
  return `<div class="form">
    <div class="f"><label for="p-birth">Mon mois de naissance</label><input id="p-birth" type="month" value="${esc(p.birth||"")}"><span class="hint">Sert uniquement à calculer jusqu'à quand tu as droit aux tarifs jeunes. Reste sur ce téléphone.</span></div>
    <div class="f"><label>Où je cherche des bons plans</label>${multi("places",DPLACES.filter(x=>x!=="Partout"&&x!=="Région").map(x=>[x,x]))}</div>
    <div class="f"><label>Ce qui m'intéresse</label>${multi("interests",DCATS.map(c=>[c.k,c.n]))}</div>
    <div class="f"><label>Mes sports</label>${multi("sports",[["ski","Ski / hiver"],["rando","Rando, trail"],["escalade","Escalade"],["salle","Salle, running"]])}</div>
    <div class="f"><label>Mes voyages</label>${multi("travel",[["weekend","Week-ends en France"],["europe","Europe pas cher"],["sportif","Voyages sportifs"],["loin","Loin et longtemps"]])}</div>
  </div>
  <p class="note">Le profil filtre les suggestions de l'onglet « Pour toi ». Chaque modification est enregistrée tout de suite.</p>`;
}
function saveProfile(patch){ DB.settings.profile={...prof(), ...patch}; syncU26Item(); persist(); }
function syncU26Item(){
  DB.items=DB.items.filter(x=>x.tpl!=="u26");
  const l=ageLimit(26); if(!l || daysTo(l)<0) return;
  DB.items.push({id:uid(),tpl:"u26",domain:"bonsplans",title:"Dernier mois des tarifs -26 ans",due:addMonths(l,-1),repeat:0,where:"",amount:"",note:"Carte TER illico LIBERTÉ JEUNES, musées gratuits pour les 18-25 ans, expos du musée de Grenoble… Profites-en avant tes 26 ans.",updatedAt:iso(new Date())});
}

function syncDealItem(d){
  DB.items=DB.items.filter(x=>x.tpl!==`deal-${d.id}`);
  if(!d.used && d.end && daysTo(d.end)>=0){ const due=daysTo(d.end)>3?addDays(d.end,-3):d.end;
    DB.items.push({id:uid(),tpl:`deal-${d.id}`,domain:"bonsplans",title:`Bon plan qui expire : ${d.title}`,due,repeat:0,where:"",amount:"",note:`Valable jusqu'au ${fmt(d.end)}.`,updatedAt:iso(new Date())}); }
}
function saveDeal(d){ const o=upsert("deals",d); syncDealItem(o); persist(); return o; }
function saveDealForm(){
  const title=$("#dl-title").value.trim(); if(!title){ $("#dl-title").focus(); return; }
  let url=$("#dl-url").value.trim(); if(url && !/^https?:\/\//i.test(url)) url="https://"+url;
  saveDeal({...EDIT, title, cat:picked("pk-dcat")||"shopping", place:picked("pk-dplace")||"", url, code:$("#dl-code").value.trim(), start:$("#dl-start").value||null, end:$("#dl-end").value||null, note:$("#dl-note").value});
  closeSheet(); UI.tab="deals"; UI.dealSeg="mine"; render(); toast("Bon plan gardé");
}

/* ======================= Loisirs & envies =======================
   Une to-do légère : les envies sans date restent dans cet espace,
   seules les envies datées remontent dans « À venir ». */
const WTYPES = [["sortie","Sortie"],["voyage","Voyage"],["sport","Sport"],["reserver","À réserver"],["autre","Autre"]];
const WTN = Object.fromEntries(WTYPES);
const isWish = x => x.domain==="loisirs";
function wishRow(x){
  const n=x.due?daysTo(x.due):null;
  return `<div class="item ${n!==null&&n<0&&!x.done?"late":n!==null&&n<=30&&!x.done?"soon":""}" style="--c:var(--d-loisirs)">
    <button class="check ${x.done?"ticked":""}" data-wish="${esc(x.id)}" aria-label="${x.done?"Remettre dans mes envies":"C'est fait"}"><span>${ico("check",'stroke-width="3"')}</span></button>
    <button class="main" data-wish-edit="${esc(x.id)}"><span class="t" style="${x.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(x.title)}</span><span class="sub">${esc(WTN[x.wtype]||"Envie")}${x.url?" · lien":""}${x.note?` · ${esc(x.note.split("\n")[0].slice(0,40))}`:""}</span></button>
    <button class="when" data-wish-edit="${esc(x.id)}">${x.due?`<b>${x.done?"":esc(rel(x.due))}</b>${esc(fmt(x.due,{day:"numeric",month:"short"}))}`:""}</button></div>`;
}
function loisirsBlocks(){
  UI.wType=UI.wType||"all";
  const all=DB.items.filter(isWish);
  const list=all.filter(x=>UI.wType==="all"||x.wtype===UI.wType);
  const open=list.filter(x=>!x.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const done=list.filter(x=>x.done).sort((a,b)=>(b.lastDone||"").localeCompare(a.lastDone||""));
  let h=`<p class="lead2">Tes envies, sans pression. Seules celles qui ont une date apparaissent dans « À venir ».</p>
    <form id="f-wish-quick" class="search" style="background:var(--surface);height:48px">${ico("plus")}<input id="wq" placeholder="Ajouter une envie…" autocomplete="off" enterkeyhint="done"></form>
    <div class="chips" style="margin:2px -16px 10px"><button class="chip" data-wtype="all" aria-pressed="${UI.wType==="all"}">Tout</button>${WTYPES.map(([k,n])=>`<button class="chip" data-wtype="${k}" aria-pressed="${UI.wType===k}">${esc(n)}</button>`).join("")}</div>`;
  h += open.length ? `<div class="list">${open.map(wishRow).join("")}</div>`
    : `<div class="empty"><p>${all.length?"Rien à faire dans cette catégorie.":"Une sortie à tester, un week-end à organiser, un refuge à réserver… Écris-le ci-dessus et coche-le quand c'est fait."}</p>${all.length?"":`<button class="btn" data-act="open-deals">Piocher dans les bons plans</button>`}</div>`;
  if(done.length) h += `<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">${done.length} faite(s)</summary><div class="list" style="margin-top:8px">${done.map(wishRow).join("")}</div></details>`;
  return h;
}
function addWish(o){ const w=upsert("items",{domain:"loisirs",repeat:0,where:"",amount:"",note:"",wtype:UI.wType&&UI.wType!=="all"?UI.wType:"autre",due:null,...o}); return w; }
function toggleWish(id){
  const x=DB.items.find(i=>i.id===id); if(!x) return; const before={...x};
  upsert("items",{...x, done:!x.done, lastDone:!x.done?iso(today()):x.lastDone}); render();
  if(!before.done) toast("Fait, profite !", ()=>{ upsert("items",before); render(); });
}
function openWishForm(x=null, pre={}){
  EDIT = x ? {...x} : {wtype:UI.wType&&UI.wType!=="all"?UI.wType:"sortie", ...pre};
  openSheet(x?"Modifier l'envie":"Nouvelle envie", `<form id="f-wish" class="form">
    <div class="f"><label for="w-title">Envie</label><input id="w-title" required value="${esc(EDIT.title||"")}" placeholder="Ex. Week-end rando dans le Vercors"></div>
    <div class="f"><label>Type</label>${pickGroup("pk-wtype",WTYPES,EDIT.wtype||"sortie")}</div>
    <div class="f"><label for="w-due">Date</label><input id="w-due" type="date" value="${esc(EDIT.due||"")}"><span class="hint">Facultatif. Avec une date, l'envie apparaît dans « À venir ».</span></div>
    <div class="f"><label for="w-url">Lien</label><input id="w-url" type="url" inputmode="url" value="${esc(EDIT.url||"")}" placeholder="https://… (réservation, itinéraire, événement)"></div>
    <div class="f"><label for="w-note">Notes</label><textarea id="w-note" placeholder="Avec qui, budget, matériel…">${esc(EDIT.note||"")}</textarea></div>
  </form>${x?`<button class="btn block danger" data-act="wish-del">Supprimer</button>`:""}`, {right:"OK", rightAct:"save-wish"});
  if(!x && !pre.title) setTimeout(()=>$("#w-title")?.focus(),300);
}
function saveWishForm(){
  const title=$("#w-title").value.trim(); if(!title){ $("#w-title").focus(); return; }
  let url=$("#w-url").value.trim(); if(url && !/^https?:\/\//i.test(url)) url="https://"+url;
  const due=$("#w-due").value||null;
  const o={...EDIT, title, wtype:picked("pk-wtype")||"autre", due, url, note:$("#w-note").value};
  if(o.done && due && daysTo(due)>=0) o.done=false;
  addWish(o); closeSheet(); render(); toast(due?"Envie ajoutée, elle apparaît aussi dans « À venir »":"Envie ajoutée");
}
const CAT2W = {voyage:"voyage", sport:"sport", event:"sortie", culture:"sortie"};
function wishFromDeal(src){
  if(DB.items.some(x=>isWish(x)&&x.fromDeal===src.key)){ toast("Déjà dans tes envies"); return; }
  addWish({fromDeal:src.key, title:src.title, wtype:CAT2W[src.cat]||"autre", due:src.start||null, url:src.url||"", note:src.until?`Jusqu'au ${fmt(src.until)}`:""});
  render(); toast("Ajouté à tes envies (Domaines › Loisirs & envies)");
}

/* ======================= Onboarding ======================= */
function renderOnboarding(){
  if(UI.onbStep===0) return `<div class="onb">
    <span class="steps">Bienvenue</span>
    <h1>Toute ta paperasse, enfin sous contrôle.</h1>
    <p class="lead">Mon classeur te dit quoi faire et quand, et où tu as rangé chaque papier.</p>
    <div class="features">
      <div><span class="ic" style="background:var(--late)">${ico("cal")}</span><p style="margin:0"><b>Plus aucune date oubliée</b><span>Impôts, contrôle technique, mutuelle, CAF… tout est classé du plus urgent au plus lointain.</span></p></div>
      <div><span class="ic" style="background:var(--d-logement)">${ico("folder")}</span><p style="margin:0"><b>Chaque papier retrouvé en 10 secondes</b><span>Tu notes où il est rangé, et tu sais combien de temps le garder.</span></p></div>
      <div><span class="ic" style="background:var(--d-banque)">${ico("key")}</span><p style="margin:0"><b>Tout reste sur ton téléphone</b><span>Pas de compte et pas de serveur. Ça marche aussi hors ligne.</span></p></div>
    </div>
    <div class="foot"><button class="btn primary block" data-onb="next">Commencer</button><button class="linkbtn" data-act="restore-onb">J'ai déjà une sauvegarde</button></div>
    <input type="file" id="restore-file" accept="application/json,.json" hidden></div>`;
  const picked = TPL.filter(t=>t.s.includes("base")||t.s.some(s=>UI.situ.has(s)));
  const uniq = [...new Map(picked.map(t=>[t.id,t])).values()];
  return `<div class="onb">
    <span class="steps">Étape 1 sur 1</span>
    <h1>Qu'est-ce qui te concerne ?</h1>
    <p class="lead">Coche tout ce qui s'applique. On prépare tes échéances, tu n'auras plus qu'à mettre tes dates.</p>
    <div class="situ">${SITUATIONS.map(s=>`<button data-situ="${s.k}" aria-pressed="${UI.situ.has(s.k)}" style="--c:var(--d-${s.c})">${ico(s.i)}<span>${esc(s.n)}</span></button>`).join("")}</div>
    <div class="foot"><button class="btn primary block" data-onb="finish">Créer mes ${uniq.length} échéances</button><button class="linkbtn" data-onb="skip">Passer, je commence à vide</button></div></div>`;
}
function finishOnboarding(create){
  if(create){
    const have=new Set(DB.items.map(x=>x.tpl).filter(Boolean));
    const picked=TPL.filter(t=>(t.s.includes("base")||t.s.some(s=>UI.situ.has(s)))&&!have.has(t.id));
    for(const t of picked) DB.items.push({id:uid(),tpl:t.id,title:t.t,domain:t.d,repeat:t.r,due:t.md?nextFromMD(t.md):null,note:t.note||"",where:"",amount:"",updatedAt:iso(new Date())});
  }
  DB.settings.onboarded=true; persist(); UI.tab="home"; render();

function markDone(id){
  const x=DB.items.find(i=>i.id===id); if(!x||!x.due) return;
  const before={...x};
  if(x.repeat){ let next=addMonths(x.due,x.repeat); while(daysTo(next)<0) next=addMonths(next,x.repeat); upsert("items",{...x,due:next,lastDone:iso(today())}); closeSheet(); render(); toast(`Fait. Prochaine fois : ${fmt(next)}`, ()=>{ upsert("items",before); render(); }); }
  else { upsert("items",{...x,done:true,lastDone:iso(today())}); closeSheet(); render(); toast("Terminé, bien joué.", ()=>{ upsert("items",before); render(); }); }
  try{ navigator.vibrate && navigator.vibrate(10); }catch(e){}
}

async function shareOrDownload(filename, text, mime){
  const file = new File([text], filename, {type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename}); return true; }
    catch(e){ if(e && e.name==="AbortError") return false; }
  }
  const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
}
async function backup(){
  const data=JSON.stringify({app:"mon-classeur", version:2, exportedAt:new Date().toISOString(), items:DB.items, docs:DB.docs, notes:DB.notes, jobs:DB.jobs, deals:DB.deals, profile:DB.settings.profile||null, csp:DB.settings.csp}, null, 2);
  const ok=await shareOrDownload(`mon-classeur-sauvegarde-${iso(today())}.json`, data, "application/json");
  if(ok){ DB.settings.lastBackup=iso(today()); persist(); render(); toast("Sauvegarde créée. Range-la dans Fichiers ou iCloud Drive."); }
}
function restoreFrom(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result); if(!Array.isArray(j.items)&&!Array.isArray(j.docs)) throw 0;
    const clean = (arr)=> (Array.isArray(arr)?arr:[]).filter(o=>o&&typeof o==="object"&&o.title).map(o=>({...o, id:String(o.id||uid())}));
    const items=clean(j.items), docs=clean(j.docs), notes=clean(j.notes);
    const byId=(cur,inc)=>{ const m=new Map(cur.map(x=>[x.id,x])); inc.forEach(x=>m.set(x.id,x)); return [...m.values()]; };
    DB.items=byId(DB.items,items); DB.docs=byId(DB.docs,docs); DB.notes=byId(DB.notes,notes); DB.deals=byId(DB.deals||[],(Array.isArray(j.deals)?j.deals:[]).filter(o=>o&&typeof o==="object"&&o.title).map(o=>({...o,id:String(o.id||uid())}))); if(j.profile&&typeof j.profile==="object") DB.settings.profile={...prof(),...j.profile}; DB.jobs=byId(DB.jobs,(Array.isArray(j.jobs)?j.jobs:[]).filter(o=>o&&typeof o==="object"&&o.company).map(o=>({...o,id:String(o.id||uid())}))); DB.settings.onboarded=true;
    if(j.csp && typeof j.csp==="object" && /^\d{4}-\d{2}-\d{2}$/.test(j.csp.remise||"")) DB.settings.csp={remise:j.csp.remise, signature:j.csp.signature||null, solde:j.csp.solde||null, anc1an:j.csp.anc1an!==false}; persist(); closeSheet(); UI.tab="home"; render();
    toast(`${items.length} échéance(s) et ${docs.length} document(s) restaurés`);
  }catch(e){ toast("Ce fichier n'est pas une sauvegarde de Mon classeur."); } };
  r.readAsText(file);
}
function icsText(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
async function exportICS(){
  const list=DB.items.filter(x=>x.due&&!x.done);
  if(!list.length){ toast("Aucune échéance datée à envoyer."); return; }
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const ev=list.map(x=>{const n=parse(x.due); n.setDate(n.getDate()+1);
    return ["BEGIN:VEVENT",`UID:${x.id}@mon-classeur`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${x.due.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${iso(n).replace(/-/g,"")}`,
      `SUMMARY:${icsText(x.title)}`,`DESCRIPTION:${icsText([DOM[x.domain]?.n,x.note].filter(Boolean).join(" — "))}`,
      ...(x.repeat?[`RRULE:FREQ=MONTHLY;INTERVAL=${x.repeat}`]:[]),
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsText(x.title)}`,"TRIGGER:-P7D","END:VALARM","END:VEVENT"].join("\r\n");});
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mon classeur//FR","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
  const ok=await shareOrDownload("mon-classeur.ics", ics, "text/calendar");
  if(ok) toast(`${list.length} échéance(s) prête(s) pour Calendrier`);
}

/* ======================= Toast ======================= */
let toastT;
function toast(msg, undo){
  clearTimeout(toastT);
  $("#toast-root").innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button id="undo">Annuler</button>`:""}</div>`;
  if(undo) $("#undo").onclick=()=>{ undo(); $("#toast-root").innerHTML=""; };
  toastT=setTimeout(()=>$("#toast-root").innerHTML="", undo?5000:3200);
}

/* ======================= Événements ======================= */
document.addEventListener("click", e=>{

  if(ds.doc){ openDocDetail(ds.doc); return; }
  if(ds.note){ openNoteDetail(ds.note); return; }
  if(ds.job){ openJob(ds.job); return; }
  if(ds.wish){ toggleWish(ds.wish); return; }
  if(ds.wishEdit){ openWishForm(DB.items.find(x=>x.id===ds.wishEdit)); return; }
  if(ds.wtype){ UI.wType=ds.wtype; render(); return; }
  if(ds.wishFromSugg){ const sg=SUGG.find(x=>x.id===ds.wishFromSugg); if(sg) wishFromDeal({key:"s:"+sg.id,title:sg.t,cat:sg.cat,start:sg.start,until:sg.until,url:sg.url}); return; }

  if(ds.suggHide){ DB.settings.hiddenSugg=[...new Set([...(DB.settings.hiddenSugg||[]),ds.suggHide])]; persist(); render(); toast("Masqué"); return; }
  if(ds.dealUsed){ const d=(DB.deals||[]).find(x=>x.id===ds.dealUsed); if(d){ const before={...d}; d.used=true; saveDeal(d); render(); toast("Noté, bien joué !", ()=>{ saveDeal(before); render(); }); } return; }

  if(ds.pval!==undefined){ const g=b.parentElement.dataset.pgroup; const cur=new Set(prof()[g]||[]); cur.has(ds.pval)?cur.delete(ds.pval):cur.add(ds.pval); b.setAttribute("aria-pressed",String(cur.has(ds.pval))); saveProfile({[g]:[...cur]}); return; }

  if(ds.sheetAct==="save-wish"){ saveWishForm(); return; }
  if(ds.sheetAct==="save-job-sub"){ saveJobSub(); return; }
  if(ds.sheetAct==="save-job-next"){ const j=DB.jobs.find(x=>x.id===EDIT.jobId); if(j){ j.next=$("#nx-date").value||null; j.nextLabel=picked("pk-next")||"Relancer"; saveJob(j); render(); openJob(j.id); toast(j.next?`Prévu le ${fmt(j.next)}`:"Action retirée"); } return; }
  switch(ds.act){
    case "add": openAdd(); break;
    case "add-item": openItemForm(); break;
    case "add-doc": openDocForm(); break;
    case "add-note": openNoteForm(); break;
    case "add-note-rdv": openNoteForm(null,true); break;
    case "edit-note": openNoteForm(DB.notes.find(x=>x.id===ds.id)); break;
    case "del-note": if(b.dataset.armed){ remove("notes",EDIT.id); closeSheet(); render(); toast("Note supprimée"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "csp-setup": openCspSetup(); break;
    case "job-new": openJobForm(); break;
    case "wish-del": if(b.dataset.armed){ remove("items",EDIT.id); closeSheet(); render(); toast("Envie supprimée"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "open-deals": UI.tab="deals"; render(); window.scrollTo(0,0); break;
    case "deal-new": openDealForm(); break;
    case "deal-del": if(b.dataset.armed){ const id=EDIT.id; DB.deals=DB.deals.filter(x=>x.id!==id); DB.items=DB.items.filter(x=>x.tpl!==`deal-${id}`); persist(); closeSheet(); render(); toast("Supprimé"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "sugg-unhide": DB.settings.hiddenSugg=[]; persist(); render(); break;
    case "job-edit": openJobForm(DB.jobs.find(x=>x.id===ds.id)); break;
    case "job-del": if(b.dataset.armed){ const id=EDIT.id; DB.jobs=DB.jobs.filter(x=>x.id!==id); DB.items=DB.items.filter(x=>x.jobId!==id); persist(); closeSheet(); render(); toast("Entreprise supprimée"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "job-archive": { const j=DB.jobs.find(x=>x.id===ds.id); if(j){ j.archived=!j.archived; if(j.archived) j.next=null; saveJob(j); render(); closeSheet(); toast(j.archived?"Archivée":"Sortie des archives"); } } break;
    case "job-log": openJobSub("log", ds.id, ds.sub); break;
    case "job-int": openJobSub("int", ds.id, ds.sub); break;
    case "job-ctc": openJobSub("ctc", ds.id, ds.sub); break;
    case "job-sub-del": if(b.dataset.armed){ delJobSub(); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "job-next": openJobNext(ds.id); break;
    case "job-next-done": { const j=DB.jobs.find(x=>x.id===ds.id); if(j){ j.next=null; saveJob(j); render(); openJob(j.id); toast("Action faite"); } } break;
    case "job-recap": openJobRecap(); break;
    case "job-recap-share": { const t=jobRecapText(); (async()=>{ try{ if(navigator.share){ await navigator.share({title:"Ma recherche d'emploi", text:t}); return; } }catch(e){ if(e&&e.name==="AbortError") return; } try{ await navigator.clipboard.writeText(t); toast("Copié"); }catch(e){ const ta=$("#recap-txt"); ta.removeAttribute("readonly"); ta.select(); toast("Texte sélectionné : copie-le"); } })(); } break;
    case "job-recap-note": upsert("notes",{title:`Récap recherche d'emploi`, date:iso(today()), body:jobRecapText(), domain:"chomage"}); closeSheet(); render(); toast("Note enregistrée dans Chômage & CSP"); break;
    case "open-job-from-item": closeSheet(); UI.tab="jobs"; render(); openJob(ds.id); break;
    case "templates": openTemplates(); break;
    case "templates-dom": openTemplates(UI.domKey); break;
    case "edit-item": openItemForm(DB.items.find(x=>x.id===ds.id)); break;
    case "edit-doc": openDocForm(DB.docs.find(x=>x.id===ds.id)); break;
    case "del-item": if(b.dataset.armed){ remove("items",EDIT.id); closeSheet(); render(); toast("Échéance supprimée"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "del-doc": if(b.dataset.armed){ remove("docs",EDIT.id); closeSheet(); render(); toast("Document supprimé"); } else { b.dataset.armed="1"; b.textContent="Touche encore pour confirmer"; } break;
    case "backup": closeSheet(); backup(); break;
    case "restore": case "restore-onb": $("#restore-file")?.click(); break;
    case "ics": exportICS(); break;
    case "redo-onb": DB.settings.onboarded=false; UI.onbStep=1; UI.situ=new Set(); render(); window.scrollTo(0,0); break;
    case "wipe": confirmWipe(); break;
    case "wipe-yes": DB={items:[],docs:[],notes:[],jobs:[],deals:[],settings:{onboarded:false,lastBackup:null,csp:null,hideJobs:false}}; persist(); closeSheet(); UI.onbStep=0; render(); break;
  }
});
document.addEventListener("submit", e=>{ e.preventDefault(); if(e.target.id==="f-item") saveItemForm(); if(e.target.id==="f-doc") saveDocForm(); if(e.target.id==="f-csp") saveCsp(); if(e.target.id==="f-note") saveNoteForm(); if(e.target.id==="f-job") saveJobForm(); if(e.target.id==="f-deal") saveDealForm(); if(e.target.id==="f-wish") saveWishForm(); if(e.target.id==="f-wish-quick"){ const v=$("#wq").value.trim(); if(v){ addWish({title:v}); render(); setTimeout(()=>$("#wq")?.focus(),0); toast("Envie ajoutée"); } } if(e.target.id==="f-sub") saveJobSub(); });
document.addEventListener("input", e=>{ if(e.target.id==="q"){ UI.q=e.target.value; render(); } if(e.target.id==="j-city-other" && e.target.value.trim()){ document.querySelectorAll("#pk-city button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pick==="__other"))); } });
document.addEventListener("change", e=>{ if(e.target.id==="p-birth"){ saveProfile({birth:e.target.value}); toast(e.target.value?"Mois de naissance enregistré":"Effacé"); return; } if(e.target.id==="set-jobs"){ DB.settings.hideJobs=!e.target.checked; persist(); render(); return; } if(e.target.id==="restore-file" && e.target.files[0]){ restoreFrom(e.target.files[0]); e.target.value=""; } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#sheet-root").innerHTML) closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && DB.settings.onboarded) render(); });

load(); render(); updateBadge();
if("serviceWorker" in navigator && location.protocol!=="file:"){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
